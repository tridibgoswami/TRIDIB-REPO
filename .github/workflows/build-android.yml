name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK on Expo servers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Verify Expo login
        run: eas whoami

      - name: Register project with Expo (first time only)
        working-directory: mobile-app
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Show Expo project ID (copy this into app.json)
        working-directory: mobile-app
        run: |
          echo "================================================"
          echo "EXPO PROJECT ID:"
          cat app.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expo',{}).get('extra',{}).get('eas',{}).get('projectId','NOT FOUND'))"
          echo "================================================"

      - name: Build Android APK
        working-directory: mobile-app
        run: eas build -p android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build complete
        run: |
          echo "================================================"
          echo "✅ Build submitted! Download APK from expo.dev"
          echo "👉 expo.dev/accounts/tridibgoswami/projects/algo-trader/builds"
          echo "================================================"
