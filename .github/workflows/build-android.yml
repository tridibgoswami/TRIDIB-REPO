name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK on Expo servers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Verify Expo login
        run: eas whoami

      - name: Register project with Expo (first time only)
        working-directory: mobile-app
        run: eas init --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: mobile-app
        run: eas build -p android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build complete
        run: |
          echo "================================================"
          echo "✅ Build submitted! Download APK from expo.dev"
          echo "👉 expo.dev/accounts/tridibgoswami/projects/algo-trader/builds"
          echo "================================================"
