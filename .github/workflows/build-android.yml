name: Build Android APK

on:
  workflow_dispatch:       # ← lets you trigger this manually from GitHub on your phone

jobs:
  build:
    name: Build APK on Expo servers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Build Android APK
        working-directory: mobile-app
        run: eas build -p android --profile preview --non-interactive

      - name: Done
        run: echo "✅ Build complete! Check https://expo.dev for your APK download link."
